[package]
name = "relay-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
futures-util = "0.3"
haze = "0.8"
http-body = "1"
relay-core = { path = "../relay-core", features = ["backend"] }
relay-monitor = { path = "../relay-monitor", features = ["backend"] }
relay-storage = { path = "../relay-storage", features = ["backend"] }
relay-targets = { path = "../relay-targets", features = ["backend"] }
relay-vpn = { path = "../relay-vpn", features = ["backend"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks", "stream", "http2"] }
tokio = { version = "1", features = ["net", "rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
