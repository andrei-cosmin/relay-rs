[package]
name = "relay-settings"
version = "0.1.0"
edition = "2024"

[dependencies]
relay-core = { path = "../relay-core" }
dioxus-fullstack = { version = "0.7.10", default-features = false }
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", optional = true }
dioxus-server = { version = "0.7.10", optional = true }
ron = { version = "0.12", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
server = ["relay-core/server", "dioxus-fullstack/server", "dep:axum", "dep:dioxus-server", "dep:ron", "dep:tokio"]
web = ["dioxus-fullstack/web"]
