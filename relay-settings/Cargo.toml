[package]
name = "relay-settings"
version = "0.1.0"
edition = "2024"

[dependencies]
relay-tunnel = { path = "../relay-tunnel" }
dioxus-fullstack = { version = "0.7.10", default-features = false }
serde = { version = "1", features = ["derive"] }
dioxus-server = { version = "0.7.10", optional = true }
relay-core = { path = "../relay-core", optional = true }
relay-proxy = { path = "../relay-proxy", optional = true }
relay-storage = { path = "../relay-storage", optional = true }
ron = { version = "0.12", optional = true }
haze = { git = "https://github.com/andrei-cosmin/haze-rs", tag = "v0.8.0" }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
server = ["relay-tunnel/server", "dioxus-fullstack/server", "dep:dioxus-server", "dep:ron", "dep:relay-core", "relay-core/server", "dep:relay-proxy", "dep:relay-storage", "relay-storage/server", "haze/server", "dep:tokio"]
web = ["dioxus-fullstack/web", "relay-tunnel/web"]
standalone = ["haze/standalone"]
