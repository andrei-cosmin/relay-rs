[package]
name = "relay-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
relay-core = { path = "../relay-core" }
relay-monitor = { path = "../relay-monitor" }
relay-settings = { path = "../relay-settings" }
relay-targets = { path = "../relay-targets" }
relay-tunnel = { path = "../relay-tunnel" }
relay-vpn = { path = "../relay-vpn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dioxus-fullstack = { version = "0.7.10", default-features = false }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "hooks", "signals", "asset", "document"] }
dioxus-sdk-time = "0.7.0"
futures-util = "0.3"
haze = { git = "https://github.com/andrei-cosmin/haze-rs", tag = "v0.8.0", features = ["hooks"] }

[features]
web = [
    "dioxus-fullstack/web",
    "relay-monitor/web",
    "relay-settings/web",
    "relay-targets/web",
    "relay-tunnel/web",
    "relay-vpn/web",
]
