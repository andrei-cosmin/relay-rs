[package]
name = "relay-vpn"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus-fullstack = { version = "0.7.10", default-features = false }
serde = { version = "1", features = ["derive"] }
dioxus-server = { version = "0.7.10", optional = true }
haze = { git = "https://github.com/andrei-cosmin/haze-rs", tag = "v0.8.0" }
relay-core = { path = "../relay-core", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }

[features]
backend = ["dep:tokio", "dep:tracing", "dep:relay-core", "relay-core/backend"]
server = ["backend", "dioxus-fullstack/server", "dep:dioxus-server", "haze/server"]
web = ["dioxus-fullstack/web"]
standalone = ["backend", "haze/standalone"]
